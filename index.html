<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Gastronómico - Web Component</title>
  <script src="js/main.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1c1917 0%, #292524 100%);
      color: #f5f5f4;
      min-height: 100vh;
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 45px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: #a8a29e;
      font-size: 1rem;
    }

    .menu-grid {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1100px;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Nuestra Carta Especial</h1>
    <p>Platos preparados al momento con ingredientes seleccionados</p>
  </header>

  <template id="plato-template">
    <style>
      .card {
        background: #292524;
        border: 1px solid #44403c;
        border-top: 4px solid #f59e0b;
        border-radius: 16px;
        padding: 24px;
        width: 310px;
        min-height: 220px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 16px;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      }

      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 35px rgba(245, 158, 11, 0.18);
        border-color: #fbbf24;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .icono {
        font-size: 1.6rem;
        background: rgba(245, 158, 11, 0.12);
        padding: 8px 12px;
        border-radius: 12px;
      }

      .precio {
        font-weight: 800;
        color: #fbbf24;
        font-size: 1.35rem;
        background: rgba(251, 191, 36, 0.1);
        padding: 6px 12px;
        border-radius: 10px;
        border: 1px solid rgba(251, 191, 36, 0.25);
      }

      h3 {
        margin: 8px 0 4px 0;
        color: #fafaf9;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.3px;
      }

      .descripcion {
        color: #d6d3d1;
        font-size: 0.92rem;
        line-height: 1.5;
        border-top: 1px solid #3f3f46;
        padding-top: 12px;
      }

      .footer-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .disponible {
        background-color: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(52, 211, 153, 0.3);
      }

      .disponible::before {
        background-color: #34d399;
        box-shadow: 0 0 8px #34d399;
      }

      .agotado {
        background-color: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(248, 113, 113, 0.3);
      }

      .agotado::before {
        background-color: #f87171;
      }
    </style>

    <article class="card">
      <div>
        <div class="top-row">
          <span class="icono">🍽️</span>
          <span class="precio" id="precio-plato"></span>
        </div>

        <h3 id="nombre-plato"></h3>

        <div class="descripcion">
          <slot>Sin descripción adicional.</slot>
        </div>
      </div>

      <div class="footer-card">
        <span class="badge" id="estado-plato"></span>
      </div>
    </article>
  </template>

  <main class="menu-grid">
    <plato-menu nombre="Bandeja Típica" precio="$28.000" disponibilidad="Disponible">
      Incluye arroz, frijoles, carne asada, chicharrón, huevo frito, tajada y arepa.
    </plato-menu>

    <plato-menu nombre="Ajiaco Santafereño" precio="$22.000" disponibilidad="Disponible">
      Acompañado de crema de leche, alcaparras, aguacate y porción de arroz blanco.
    </plato-menu>

    <plato-menu nombre="Trucha al Ajillo" precio="$32.000" disponibilidad="Agotado"></plato-menu>
  </main>

</body>
</html>
