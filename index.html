<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu del Restaurante - Web Component</title>
    <script src="js/main.js"></script>
    <style>
        body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 40px;
    }
    </style>
</head>
<body>
    <template id="plato-template">
        <style>
    .card {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 20px;
    width: 260px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    gap: 10px;
    }
    .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
    }

    .h3 {
    margin: 0;
    color: #2c3e50;
    font-size: 1.2rem;
    }
    .precio {
    font-weight: bold;
    color: #27ae60;
    font-size: 1.1rem;
    }
    .badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.85rem;
    font-weight: 600;
    width: fit-content;
    }
    .disponible {
    background-color: #e8f8f5;
    color: #1e8449;
    }
    .agotado {
    background-color: #fdedec;
    color: #c0392b;
    }
    .descripcion {
    color: #555;
    font-size: 0.9rem;
    line-height: 1.4;
    }

        </style>
    </template>
</body>
</html>
